name: 'Checkout Merge'
description: 'Generate a merge commit'
author: 'jsoref'
branding:
  icon: 'git-commit'
  color: 'green'
inputs:
  base_ref:
    description: |
      This commit will be refetched (to give the merge the best chance of
      succceeding) and used as the base for the merge.
    default: ${{ github.event.pull_request.base.sha }}
    required: false
  head_ref:
    description: |
      This commit will be fetched and merged into the base commit.
    default: ${{ github.event.pull_request.head.sha }}
    required: false
  path:
    description: 'Relative path under $GITHUB_WORKSPACE to the repository'
    default: "."
    required: false
  do_not_report:
    description: 'Suppress reporting errors (consumers would report the message themselves)'
    default: ''
    required: false
outputs:
  message:
    description: "User facing message about attempt to merge"
    value: ${{ steps.merge.outputs.message }}
  status:
    description: "Whether the merge succeeded"
    value: ${{ steps.merge.status }}
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - id: merge
      shell: bash
      env:
        INPUT_BASE_REF: ${{ inputs.base_ref }}
        INPUT_HEAD_REF: ${{ inputs.head_ref }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_DO_NOT_REPORT: ${{ inputs.do_not_report }}
        GH_TOKEN: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
      run: "$ACTION_PATH/merge"
